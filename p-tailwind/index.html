<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kateryna — Tailwind</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-cream text-ink font-sans">

<header class="sticky top-0 z-20 bg-header border-t-6 border-t-stripe border-b border-b-line">
  <nav class="max-w-[1244px] mx-auto px-5 md:px-8 min-h-[68px] md:min-h-[74px] flex items-center justify-between">
    <a href="#" class="flex items-center gap-3 text-[21px] font-bold">
      <span class="relative size-7 rounded-full bg-stripe
                   after:absolute after:inset-2 after:rounded-full after:bg-header"></span>
      Kateryna
    </a>

    <div class="hidden md:flex gap-8 text-[0.95rem] font-medium text-muted">
      <a href="#projekter" class="hover:text-accent">Projekter</a>
      <a href="#om" class="hover:text-accent">Om mig</a>
      <a href="#kontakt" class="hover:text-accent">Kontakt</a>
    </div>

    <button id="burgerBtn" type="button" aria-expanded="false" aria-controls="mobileNav" aria-label="Åbn menu"
            class="group md:hidden size-11 flex flex-col items-center justify-center gap-1.5">
      <span class="block w-6 h-0.5 bg-ink transition duration-200 group-aria-expanded:translate-y-2 group-aria-expanded:rotate-45"></span>
      <span class="block w-6 h-0.5 bg-ink transition duration-200 group-aria-expanded:opacity-0"></span>
      <span class="block w-6 h-0.5 bg-ink transition duration-200 group-aria-expanded:-translate-y-2 group-aria-expanded:-rotate-45"></span>
    </button>
  </nav>

  <div id="mobileNav" class="hidden md:hidden absolute top-full inset-x-0 bg-header border-y border-line flex-col">
    <a href="#projekter" class="px-8 py-4 text-[1.05rem] border-b border-line">Projekter</a>
    <a href="#om" class="px-8 py-4 text-[1.05rem] border-b border-line">Om mig</a>
    <a href="#kontakt" class="px-8 py-4 text-[1.05rem]">Kontakt</a>
  </div>
</header>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
